<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Dash — Turkey's Great Escape</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #2b1a12;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    display: block;
    touch-action: none;
    cursor: pointer;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
  }
  #status {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
  #selftest {
    position: absolute; left: 8px; bottom: 6px;
    color: #fff; font: 12px monospace; opacity: 0.85;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"
    aria-label="Gobble Dash: a turkey escapes the farmer, dodges the oven and the carving knife, from the farmyard to the kitchen"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<div id="selftest"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
